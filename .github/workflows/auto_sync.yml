name: Auto Sync & Compile LaTeX PDFs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-xetex fonts-noto-hinted

      - name: Compile LaTeX Files
        run: |
          mkdir -p output_pdfs
          for f in *.tex; do
            [ -f "$f" ] || continue
            xelatex -interaction=nonstopmode -output-directory=output_pdfs "$f" || true
          done

      - name: Commit & Push Compiled PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output_pdfs/*.pdf
          git commit -m "Auto-compile LaTeX PDFs [skip ci]" || exit 0
          git push
