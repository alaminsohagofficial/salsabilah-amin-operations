Name: Auto Sync & PDF Compile Engine

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run API Sync Engine
        env:
          ERP_API_URL: ${{ secrets.ERP_API_URL }}
          ERP_API_TOKEN: ${{ secrets.ERP_API_TOKEN }}
        run: |
          python scripts/sync_engine.py

      - name: Install LaTeX Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended

      - name: Compile LaTeX Templates to PDF
        run: |
          mkdir -p output_pdfs
          for file in templates/*.tex; do
            if [ -f "$file" ]; then
              # Two-pass compilation for cross-references and page formatting
              pdflatex -interaction=nonstopmode -output-directory=output_pdfs "$file"
              pdflatex -interaction=nonstopmode -output-directory=output_pdfs "$file"
            fi
          done

      - name: Upload Generated PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Generated-Banking-And-ERP-PDFs
          path: output_pdfs/*.pdf
          if-no-files-found: error
