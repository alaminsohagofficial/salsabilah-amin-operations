name: Compile LaTeX PDFs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'templates/*.tex'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-xetex texlive-fonts-recommended texlive-plain-generic fonts-noto-extra

      - name: Compile TeX Files
        run: |
          cd templates
          for file in *.tex; do
            echo "Compiling $file..."
            xelatex -interaction=nonstopmode "$file" || true
          done

      - name: Upload Compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Operational-PDF-Certificates
          path: "templates/*.pdf"
