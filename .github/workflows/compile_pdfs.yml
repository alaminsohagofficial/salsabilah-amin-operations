Name: Compile LaTeX PDFs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'templates/*.tex'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bangla Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-ui-core fonts-noto-extra

      - name: Compile LaTeX Documents
        uses: xu-cheng/latex-action@v3
        continue-on-error: true
        with:
          root_file: "templates/*.tex"
          compiler: xelatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Upload Compiled PDFs
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Operational-PDF-Certificates
          path: "templates/*.pdf"
