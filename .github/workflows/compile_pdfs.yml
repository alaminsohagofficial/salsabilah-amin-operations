name: Salsabilah Amin Operations Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  treasury-operations-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Treasury Email Tracking & Confirmation
      env:
        TREASURY_EMAIL_USER: ${{ secrets.TREASURY_EMAIL_USER }}
        TREASURY_EMAIL_PASS: ${{ secrets.TREASURY_EMAIL_PASS }}
        AUDIT_OFFICER_EMAIL: ${{ secrets.AUDIT_OFFICER_EMAIL }}
      run: |
        python scripts/send_email.py
