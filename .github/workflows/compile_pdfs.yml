name: Compile LaTeX PDFs

on:
  push:
    branches: [ "main" ]
    paths:
      - 'templates/*.tex'
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Documents
        uses: xu-cheng/latex-action@v2
        with:
          root_file: |
            templates/sap_clearance_letter.tex
            templates/bank_confirmation_letter.tex
            templates/ledger_reconciliation_certificate.tex
            templates/dbbl_credit_voucher.tex
            templates/memorandum_clearance.tex

      - name: Upload Compiled PDFs
        uses: actions/upload-artifact@v4
        with:
          name: Operational-PDF-Certificates
          path: "templates/*.pdf"
